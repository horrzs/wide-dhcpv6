name: Build Android DHCPv6

on:
  push:
    branches: [ main, master, android ]
  pull_request:
    branches: [ main, master, android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26b
        add-to-path: true

    - name: Create build directory
      run: mkdir -p build/arm64-v8a

    - name: Create Android ifaddrs implementation
      run: |
        mkdir -p android
        
        # 创建 ifaddrs.h - Android 适配版
        cat > android/ifaddrs.h << 'IFADDRS_H_EOF'
        // https://android.googlesource.com/platform/bionic/+/68d0150221eb505a576f6ad5ca1f367b4ce547a0/libc/include/ifaddrs.h
        /*
         * Copyright (C) 2015 The Android Open Source Project
         * All rights reserved.
         *
         * Redistribution and use in source and binary forms, with or without
         * modification, are permitted provided that the following conditions
         * are met:
         *  * Redistributions of source code must retain the above copyright
         *    notice, this list of conditions and the following disclaimer.
         *  * Redistributions in binary form must reproduce the above copyright
         *    notice, this list of conditions and the following disclaimer in
         *    the documentation and/or other materials provided with the
         *    distribution.
         *
         * THIS SOFTWARE IS PROVIDED BY THE COPYRIGHT HOLDERS AND CONTRIBUTORS
         * "AS IS" AND ANY EXPRESS OR IMPLIED WARRANTIES, INCLUDING, BUT NOT
         * LIMITED TO, THE IMPLIED WARRANTIES OF MERCHANTABILITY AND FITNESS
         * FOR A PARTICULAR PURPOSE ARE DISCLAIMED. IN NO EVENT SHALL THE
         * COPYRIGHT OWNER OR CONTRIBUTORS BE LIABLE FOR ANY DIRECT, INDIRECT,
         * INCIDENTAL, SPECIAL, EXEMPLARY, OR CONSEQUENTIAL DAMAGES (INCLUDING,
         * BUT NOT LIMITED TO, PROCUREMENT OF SUBSTITUTE GOODS OR SERVICES; LOSS
         * OF USE, DATA, OR PROFITS; OR BUSINESS INTERRUPTION) HOWEVER CAUSED
         * AND ON ANY THEORY OF LIABILITY, WHETHER IN CONTRACT, STRICT LIABILITY,
         * OR TORT (INCLUDING NEGLIGENCE OR OTHERWISE) ARISING IN ANY WAY OUT
         * OF THE USE OF THIS SOFTWARE, EVEN IF ADVISED OF THE POSSIBILITY OF
         * SUCH DAMAGE.
         */
        #ifndef _IFADDRS_H_
        #define _IFADDRS_H_
        #include <sys/cdefs.h>
        #include <netinet/in.h>
        #include <sys/socket.h>
        __BEGIN_DECLS
        struct ifaddrs {
          struct ifaddrs* ifa_next;
          char* ifa_name;
          unsigned int ifa_flags;
          struct sockaddr* ifa_addr;
          struct sockaddr* ifa_netmask;
          union {
            struct sockaddr* ifu_broadaddr;
            struct sockaddr* ifu_dstaddr;
          } ifa_ifu;
          void* ifa_data;
        };
        #define ifa_broadaddr ifa_ifu.ifu_broadaddr
        #define ifa_dstaddr ifa_ifu.ifu_dstaddr
        void freeifaddrs(struct ifaddrs*);
        int getifaddrs(struct ifaddrs**);
        __END_DECLS
        #endif
        IFADDRS_H_EOF
        
        # 创建 ifaddrs.cpp - Android Netlink 实现
        cat > android/ifaddrs.cpp << 'IFADDRS_CPP_EOF'
        // Source: https://android.googlesource.com/platform/bionic/+/68d0150221eb505a576f6ad5ca1f367b4ce547a0/libc/bionic/ifaddrs.cpp
        extern "C" {
        /*
         * Copyright (C) 2015 The Android Open Source Project
         * All rights reserved.
         */
        #include "ifaddrs.h"
        #include <errno.h>
        #include <linux/if_packet.h>
        #include <linux/netlink.h>
        #include <linux/rtnetlink.h>
        #include <net/if.h>
        #include <netinet/in.h>
        #include <stdint.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        #include <unistd.h>

        struct ifaddrs_storage {
          ifaddrs ifa;
          int interface_index;
          sockaddr_storage addr;
          sockaddr_storage netmask;
          sockaddr_storage ifa_ifu;
          char name[IFNAMSIZ + 1];

          ifaddrs_storage(ifaddrs** list) {
            memset(this, 0, sizeof(*this));
            ifa.ifa_next = *list;
            *list = reinterpret_cast<ifaddrs*>(this);
          }

          void SetAddress(int family, const void* data, size_t byteCount) {
            addr.ss_family = family;
            memcpy(SockaddrBytes(family, &addr), data, byteCount);
            ifa.ifa_addr = reinterpret_cast<sockaddr*>(&addr);
          }

          void SetBroadcastAddress(int family, const void* data, size_t byteCount) {
            ifa_ifu.ss_family = family;
            memcpy(SockaddrBytes(family, &ifa_ifu), data, byteCount);
            ifa.ifa_dstaddr = reinterpret_cast<sockaddr*>(&ifa_ifu);
          }

          void SetNetmask(int family, size_t prefix_length) {
            netmask.ss_family = family;
            uint8_t* dst = SockaddrBytes(family, &netmask);
            memset(dst, 0xff, prefix_length / 8);
            if ((prefix_length % 8) != 0) {
              dst[prefix_length/8] = (0xff << (8 - (prefix_length % 8)));
            }
            ifa.ifa_netmask = reinterpret_cast<sockaddr*>(&netmask);
          }

          void SetPacketAttributes(int ifindex, unsigned short hatype, unsigned char halen) {
            sockaddr_ll* sll = reinterpret_cast<sockaddr_ll*>(&addr);
            sll->sll_ifindex = ifindex;
            sll->sll_hatype = hatype;
            sll->sll_halen = halen;
          }

        private:
          uint8_t* SockaddrBytes(int family, sockaddr_storage* ss) {
            if (family == AF_INET) {
              sockaddr_in* ss4 = reinterpret_cast<sockaddr_in*>(ss);
              return reinterpret_cast<uint8_t*>(&ss4->sin_addr);
            } else if (family == AF_INET6) {
              sockaddr_in6* ss6 = reinterpret_cast<sockaddr_in6*>(ss);
              return reinterpret_cast<uint8_t*>(&ss6->sin6_addr);
            } else if (family == AF_PACKET) {
              sockaddr_ll* sll = reinterpret_cast<sockaddr_ll*>(ss);
              return reinterpret_cast<uint8_t*>(&sll->sll_addr);
            }
            return nullptr;
          }
        };

        #if !defined(__clang__)
        #pragma GCC diagnostic ignored "-Wold-style-cast"
        #endif

        static void __handle_netlink_response(ifaddrs** out, nlmsghdr* hdr) {
          if (hdr->nlmsg_type == RTM_NEWLINK) {
            ifinfomsg* ifi = reinterpret_cast<ifinfomsg*>(NLMSG_DATA(hdr));
            ifaddrs_storage* new_addr = new ifaddrs_storage(out);
            new_addr->interface_index = ifi->ifi_index;
            new_addr->ifa.ifa_flags = ifi->ifi_flags;

            rtattr* rta = IFLA_RTA(ifi);
            size_t rta_len = IFLA_PAYLOAD(hdr);
            while (RTA_OK(rta, rta_len)) {
              if (rta->rta_type == IFLA_ADDRESS) {
                if (RTA_PAYLOAD(rta) < sizeof(new_addr->addr)) {
                  new_addr->SetAddress(AF_PACKET, RTA_DATA(rta), RTA_PAYLOAD(rta));
                  new_addr->SetPacketAttributes(ifi->ifi_index, ifi->ifi_type, RTA_PAYLOAD(rta));
                }
              } else if (rta->rta_type == IFLA_BROADCAST) {
                if (RTA_PAYLOAD(rta) < sizeof(new_addr->ifa_ifu)) {
                  new_addr->SetBroadcastAddress(AF_PACKET, RTA_DATA(rta), RTA_PAYLOAD(rta));
                  new_addr->SetPacketAttributes(ifi->ifi_index, ifi->ifi_type, RTA_PAYLOAD(rta));
                }
              } else if (rta->rta_type == IFLA_IFNAME) {
                if (RTA_PAYLOAD(rta) < sizeof(new_addr->name)) {
                  memcpy(new_addr->name, RTA_DATA(rta), RTA_PAYLOAD(rta));
                  new_addr->ifa.ifa_name = new_addr->name;
                }
              }
              rta = RTA_NEXT(rta, rta_len);
            }
          } else if (hdr->nlmsg_type == RTM_NEWADDR) {
            ifaddrmsg* msg = reinterpret_cast<ifaddrmsg*>(NLMSG_DATA(hdr));
            const ifaddrs_storage* addr = reinterpret_cast<const ifaddrs_storage*>(*out);
            while (addr != nullptr && addr->interface_index != static_cast<int>(msg->ifa_index)) {
              addr = reinterpret_cast<const ifaddrs_storage*>(addr->ifa.ifa_next);
            }
            if (addr == nullptr) return;

            ifaddrs_storage* new_addr = new ifaddrs_storage(out);
            strcpy(new_addr->name, addr->name);
            new_addr->ifa.ifa_name = new_addr->name;
            new_addr->ifa.ifa_flags = addr->ifa.ifa_flags;
            new_addr->interface_index = addr->interface_index;

            rtattr* rta = IFA_RTA(msg);
            size_t rta_len = IFA_PAYLOAD(hdr);
            while (RTA_OK(rta, rta_len)) {
              if (rta->rta_type == IFA_ADDRESS) {
                if (msg->ifa_family == AF_INET || msg->ifa_family == AF_INET6) {
                  new_addr->SetAddress(msg->ifa_family, RTA_DATA(rta), RTA_PAYLOAD(rta));
                  new_addr->SetNetmask(msg->ifa_family, msg->ifa_prefixlen);
                }
              } else if (rta->rta_type == IFA_BROADCAST) {
                if (msg->ifa_family == AF_INET || msg->ifa_family == AF_INET6) {
                  new_addr->SetBroadcastAddress(msg->ifa_family, RTA_DATA(rta), RTA_PAYLOAD(rta));
                }
              }
              rta = RTA_NEXT(rta, rta_len);
            }
          }
        }

        static bool __send_netlink_request(int fd, int type) {
          struct NetlinkMessage {
            nlmsghdr hdr;
            rtgenmsg msg;
          } request;
          memset(&request, 0, sizeof(request));
          request.hdr.nlmsg_flags = NLM_F_DUMP | NLM_F_REQUEST;
          request.hdr.nlmsg_type = type;
          request.hdr.nlmsg_len = sizeof(request);
          request.msg.rtgen_family = AF_UNSPEC;
          return (TEMP_FAILURE_RETRY(send(fd, &request, sizeof(request), 0)) == sizeof(request));
        }

        static bool __read_netlink_responses(int fd, ifaddrs** out, char* buf, size_t buf_len) {
          ssize_t bytes_read;
          while ((bytes_read = TEMP_FAILURE_RETRY(recv(fd, buf, buf_len, 0))) > 0) {
            nlmsghdr* hdr = reinterpret_cast<nlmsghdr*>(buf);
            for (; NLMSG_OK(hdr, static_cast<size_t>(bytes_read)); hdr = NLMSG_NEXT(hdr, bytes_read)) {
              if (hdr->nlmsg_type == NLMSG_DONE) return true;
              if (hdr->nlmsg_type == NLMSG_ERROR) return false;
              __handle_netlink_response(out, hdr);
            }
          }
          return false;
        }

        int getifaddrs(ifaddrs** out) {
          *out = nullptr;
          size_t buf_len = 8192;
          char* buf = new char[buf_len];
          if (buf == nullptr) return -1;

          int fd = socket(PF_NETLINK, SOCK_RAW | SOCK_CLOEXEC, NETLINK_ROUTE);
          bool okay = fd != -1 &&
              __send_netlink_request(fd, RTM_GETLINK) && __read_netlink_responses(fd, out, buf, buf_len) &&
              __send_netlink_request(fd, RTM_GETADDR) && __read_netlink_responses(fd, out, buf, buf_len);

          if (!okay) {
            freeifaddrs(*out);
            *out = nullptr;
          }
          {
            int saved_errno = errno;
            close(fd);
            delete[] buf;
            errno = saved_errno;
          }
          return okay ? 0 : -1;
        }

        void freeifaddrs(ifaddrs* list) {
          while (list != nullptr) {
            ifaddrs* current = list;
            list = list->ifa_next;
            free(current);
          }
        }
        }
        IFADDRS_CPP_EOF

    - name: Create CMakeLists.txt
      run: |
        cat > CMakeLists.txt << 'EOF'
        cmake_minimum_required(VERSION 3.10)
        project(wide-dhcpv6)

        # --- dhcp6c 源文件 ---
        add_executable(dhcp6c
            android/ifaddrs.cpp
            addrconf.c
            auth.c
            base64.c
            cfparse.c
            cftoken.c
            common.c
            config.c
            dhcp6_ctl.c
            dhcp6c.c
            dhcp6c_ia.c
            dhcp6c_script.c
            if.c
            lease.c
            prefixconf.c
            timer.c
        )

        # --- dhcp6ctl 源文件 ---
        add_executable(dhcp6ctl
            auth.c
            base64.c
            dhcp6_ctlclient.c
        )

        # 包含目录
        target_include_directories(dhcp6c PRIVATE ${CMAKE_SOURCE_DIR} ${CMAKE_SOURCE_DIR}/android)
        target_include_directories(dhcp6ctl PRIVATE ${CMAKE_SOURCE_DIR})

        # --- dhcp6c 编译宏 ---
        target_compile_definitions(dhcp6c PRIVATE
            SYSCONFDIR="."
            LOCALDBDIR="."
            LINE_MAX=120
            HAVE_GETADDRINFO=1
            HAVE_GETNAMEINFO=1
            HAVE_IF_NAMETOINDEX=1
            HAVE_STRLCPY=1
            HAVE_STRLCAT=1
            HAVE_DAEMON=1
            HAVE_WARNX=1
            STDC_HEADERS=1
            HAVE_SYS_TYPES_H=1
            HAVE_SYS_STAT_H=1
            HAVE_STDLIB_H=1
            HAVE_STRING_H=1
            HAVE_MEMORY_H=1
            HAVE_STRINGS_H=1
            HAVE_INTTYPES_H=1
            HAVE_STDINT_H=1
            HAVE_UNISTD_H=1
            HAVE_FCNTL_H=1
            HAVE_SYS_IOCTL_H=1
            HAVE_SYS_TIME_H=1
            HAVE_SYSLOG_H=1
            HAVE_IFADDRS_H=1
            TIME_WITH_SYS_TIME=1
            HAVE_STRUCT_TM_TM_ZONE=1
            HAVE_TM_ZONE=1
            HAVE_SIG_ATOMIC_T=1
            GETPGRP_VOID=1
            SETPGRP_VOID=1
            RETSIGTYPE=void
            HAVE_MKTIME=1
            HAVE_SELECT=1
            HAVE_SOCKET=1
            HAVE_CLOCK_GETTIME=1
            HAVE_ARC4RANDOM=1
            HAVE_ANSI_FUNC=1
            HAVE_TAILQ_FOREACH_REVERSE_OLD=1
            HAVE_STDARG_H=1
        )

        # --- dhcp6ctl 编译宏 ---
        target_compile_definitions(dhcp6ctl PRIVATE
            SYSCONFDIR="."
            LOCALDBDIR="."
            LINE_MAX=120
            HAVE_STDARG_H=1
            STDC_HEADERS=1
        )

        # --- 编译选项 ---
        target_compile_options(dhcp6c PRIVATE -Wno-format-zero-length)
        target_compile_options(dhcp6ctl PRIVATE -Wno-format-zero-length)

        # C/C++ 标准
        set_target_properties(dhcp6c PROPERTIES
            C_STANDARD 99
            C_STANDARD_REQUIRED YES
            CXX_STANDARD 11
            CXX_STANDARD_REQUIRED YES
        )
        set_target_properties(dhcp6ctl PROPERTIES
            C_STANDARD 99
            C_STANDARD_REQUIRED YES
        )

        # --- 链接库 ---
        find_library(log-lib log)
        if(log-lib)
            target_link_libraries(dhcp6c PRIVATE ${log-lib})
            target_link_libraries(dhcp6ctl PRIVATE ${log-lib})
        endif()
        EOF

    - name: Build with CMake
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        cd build/arm64-v8a
        cmake ../.. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-21 \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build . --config Release

    - name: Strip binaries
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
        $STRIP build/arm64-v8a/dhcp6c
        $STRIP build/arm64-v8a/dhcp6ctl

    - name: Prepare artifacts
      run: |
        mkdir -p artifacts/arm64-v8a
        cp build/arm64-v8a/dhcp6c artifacts/arm64-v8a/
        cp build/arm64-v8a/dhcp6ctl artifacts/arm64-v8a/
        cp dhcp6c.conf.sample artifacts/arm64-v8a/dhcp6c.conf
        
        # 创建使用说明
        cat > artifacts/arm64-v8a/README.txt << 'EOF'
        DHCPv6 Client for Android (arm64-v8a)
        ======================================
        
        使用方法:
        1. 将所有文件推送到设备:
           adb push dhcp6c /data/local/tmp/dhcpv6/
           adb push dhcp6ctl /data/local/tmp/dhcpv6/
           adb push dhcp6c.conf /data/local/tmp/dhcpv6/
        
        2. 设置执行权限:
           adb shell chmod 755 /data/local/tmp/dhcpv6/dhcp6c
           adb shell chmod 755 /data/local/tmp/dhcpv6/dhcp6ctl
        
        3. 编辑配置文件 dhcp6c.conf
        
        4. 运行 dhcp6c:
           adb shell
           cd /data/local/tmp/dhcpv6
           ./dhcp6c -Df wlan0
        
        注意:
        - DUID 文件会自动生成在当前目录
        - 配置文件必须与可执行文件在同一目录
        - 需要 root 权限才能正常获取 IPv6 地址
        EOF

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dhcpv6-android-arm64-v8a
        path: artifacts/arm64-v8a/
